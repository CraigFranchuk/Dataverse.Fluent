<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Dataverse.Fluent package icon. Render to icon.png with assets/render-icon.ps1. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B2FC9"/>
      <stop offset="1" stop-color="#0E9F9A"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <g fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <!-- A data store: three stacked disks. -->
    <ellipse cx="176" cy="148" rx="104" ry="40"/>
    <path d="M72 148 V364 C72 386 118 404 176 404 C234 404 280 386 280 364 V148"/>
    <path d="M72 220 C72 242 118 260 176 260 C234 260 280 242 280 220"/>
    <path d="M72 292 C72 314 118 332 176 332 C234 332 280 314 280 292"/>

    <!-- A chain of calls flowing out of it. -->
    <path d="M398 216 L440 256 L398 296"/>
  </g>
  <circle cx="328" cy="256" r="19" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="370" cy="256" r="19" fill="#FFFFFF" opacity="0.85"/>
</svg>
