name: Release

# Push a tag such as v1.0.0 to publish. The tag must match <VersionPrefix> in Directory.Build.props.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write # NuGet Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Check the tag matches the version
        run: |
          version=$(dotnet msbuild Dataverse.Fluent/Dataverse.Fluent.csproj -getProperty:VersionPrefix)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VersionPrefix $version in Directory.Build.props."
            exit 1
          fi

      - name: Build
        run: dotnet build Dataverse.Fluent.slnx -c Release

      - name: Test
        run: |
          dotnet test Dataverse.Fluent.Tests/Dataverse.Fluent.Tests.csproj -c Release --no-build
          dotnet test Dataverse.Fluent.Sales.Tests/Dataverse.Fluent.Sales.Tests.csproj -c Release --no-build
          dotnet test Dataverse.Fluent.Testing.Tests/Dataverse.Fluent.Testing.Tests.csproj -c Release --no-build

      - name: Pack
        run: dotnet pack Dataverse.Fluent.slnx -c Release --no-build -o artifacts

      # Exchanges the workflow's OIDC token for a short-lived NuGet API key.
      - name: NuGet login
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Pushes each .nupkg and the .snupkg symbols beside it.
      - name: Push
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
