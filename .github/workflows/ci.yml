name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Build
        run: dotnet build Dataverse.Fluent.slnx -c Release

      # Unit tests only; the integration tests need a live Dataverse environment.
      - name: Test
        run: |
          dotnet test Dataverse.Fluent.Tests/Dataverse.Fluent.Tests.csproj -c Release --no-build
          dotnet test Dataverse.Fluent.Sales.Tests/Dataverse.Fluent.Sales.Tests.csproj -c Release --no-build

      - name: Pack
        run: dotnet pack Dataverse.Fluent.slnx -c Release --no-build -o artifacts --version-suffix "ci.${{ github.run_number }}"

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*
